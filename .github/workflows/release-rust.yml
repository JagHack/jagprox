name: Release

# A v3+ tag builds everything, tests the installers and creates a draft GitHub
# release. Run it by hand (Actions > Release > Run workflow) to build and test
# without releasing; the files are then attached to the run.
on:
  push:
    tags:
      - 'v[3-9].*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The native launcher (egui) is packaged with cargo-packager; rpm with
  # cargo-generate-rpm (cargo-packager has no rpm target); the Windows installer
  # with a hand-written NSIS script (crates/jagprox-gui/windows/installer.nsi).
  PACKAGER: 'cargo-packager@0.11.8'
  GENERATE_RPM: 'cargo-generate-rpm@0.21.1'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version from Cargo.toml (must match the tag)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match Cargo.toml version $version"
            exit 1
          fi

  cli-linux:
    needs: version
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Build static jagprox
        run: cargo build --release --locked -p jagprox-cli --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Package
        run: |
          bin=target/${{ matrix.arch }}-unknown-linux-musl/release/jagprox
          file "$bin" | grep -q static
          "$bin" --version
          mkdir -p out && cp "$bin" LICENSE NOTICE out/
          tar -czf jagprox-linux-${{ matrix.arch }}.tar.gz -C out jagprox LICENSE NOTICE
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: jagprox-linux-${{ matrix.arch }}.tar.gz

  app-linux:
    needs: version
    strategy:
      matrix:
        include:
          # 22.04: the oldest glibc we build against, so the launcher runs on older distros too.
          - arch: x86_64
            deb: amd64
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: aarch64
            deb: arm64
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies for the egui launcher, the AppImage and rpm
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libxcursor-dev libxrandr-dev libxi-dev libx11-dev \
            libfontconfig1-dev libfreetype-dev libssl-dev libdbus-1-dev \
            libfuse2 file rpm
      - uses: Swatinem/rust-cache@v2
      - name: Install packaging tools
        run: cargo install --locked "$PACKAGER" "$GENERATE_RPM"
      - name: Build the launcher and the jagprox CLI (glibc)
        run: |
          cargo build --release --locked -p jagprox-gui -p jagprox-cli
          mkdir -p crates/jagprox-gui/binaries
          cp target/release/jagprox crates/jagprox-gui/binaries/jagprox-${{ matrix.triple }}
      - name: Build the .deb and AppImage
        run: cargo packager -p jagprox-gui --formats deb appimage --out-dir dist-pkg
      - name: Build the .rpm
        run: cargo generate-rpm -p crates/jagprox-gui
      - name: Collect
        run: |
          mkdir -p dist
          cp dist-pkg/*_amd64.deb "dist/jagprox_${V}_amd64.deb" 2>/dev/null || true
          cp dist-pkg/*_arm64.deb "dist/jagprox_${V}_arm64.deb" 2>/dev/null || true
          cp dist-pkg/*_${{ matrix.arch }}.AppImage "dist/JagProx-${V}-${{ matrix.arch }}.AppImage"
          cp target/generate-rpm/jagprox-${V}-1.${{ matrix.arch }}.rpm dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux-${{ matrix.arch }}
          path: dist/*
      - name: Test the .deb
        run: |
          sudo apt-get install -y "./dist/jagprox_${V}_${{ matrix.deb }}.deb"
          jagprox --version | grep -F "$V"
          test "$(cat /usr/lib/jagprox/package)" = deb
          test -x /usr/bin/jagprox-launcher
          jagprox install-cli | grep -F "Nothing to do"
          sudo apt-get remove -y jagprox
      - name: Test the AppImage's jagprox link
        run: |
          app="$PWD/dist/JagProx-${V}-${{ matrix.arch }}.AppImage"
          chmod +x "$app"
          link="$RUNNER_TEMP/test-bin/jagprox"
          mkdir -p "$RUNNER_TEMP/test-bin" && ln -s "$app" "$link"
          out=$("$link" --version 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -F "$V"
          # install-cli with a scratch home: links ~/.local/bin/jagprox to the AppImage.
          HOME="$RUNNER_TEMP/home" "$link" install-cli < /dev/null
          test "$(readlink "$RUNNER_TEMP/home/.local/bin/jagprox")" = "$app"

  app-windows:
    needs: version
    runs-on: windows-latest
    env:
      V: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build jagprox-launcher.exe and jagprox.exe (static C runtime)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p jagprox-gui -p jagprox-cli
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build the installer
        run: |
          # NSIS needs native (back-slash) paths; Join-Path gives those.
          $root = $PWD.Path
          $staging = Join-Path $env:RUNNER_TEMP 'nsis'
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item target/release/jagprox-launcher.exe $staging
          Copy-Item target/release/jagprox.exe $staging
          Copy-Item LICENSE $staging
          Copy-Item NOTICE $staging
          New-Item -ItemType Directory -Force dist | Out-Null
          $win = Join-Path $root 'crates\jagprox-gui\windows'
          $icons = Join-Path $root 'crates\jagprox-gui\icons'
          $out = Join-Path $root "dist\JagProx-Setup-$env:V.exe"
          & "$env:ProgramFiles (x86)\NSIS\makensis.exe" `
            "/DVERSION=$env:V" `
            "/DSOURCEDIR=$staging" `
            "/DOUTFILE=$out" `
            "/DICON=$icons\icon.ico" `
            "/DHEADER=$win\installer-header.bmp" `
            "/DSIDEBAR=$win\installer-sidebar.bmp" `
            "$win\installer.nsi"
          if (-not (Test-Path $out)) { throw "installer was not built" }
      - name: Test install over JagProx 2, PATH and uninstall
        run: |
          # JagProx 2.6.1 (Electron), as existing users have it.
          gh release download v2.6.1 -R JagHack/jagprox -p 'JagProx-Setup-2.6.1.exe' -D old
          Start-Process -Wait old/JagProx-Setup-2.6.1.exe -ArgumentList '/S','/currentuser'
          $old = "$env:LOCALAPPDATA\Programs\JagProx"
          if (-not (Test-Path "$old\Uninstall JagProx.exe")) { throw "JagProx 2 didn't install to $old" }

          Start-Process -Wait "dist/JagProx-Setup-$env:V.exe" -ArgumentList '/S'
          $dir = "$env:LOCALAPPDATA\JagProx"
          & "$dir\jagprox.exe" --version
          if (-not (Test-Path "$dir\jagprox-launcher.exe")) { throw "launcher missing" }
          if (Test-Path "$old\Uninstall JagProx.exe") { throw "JagProx 2 is still installed" }
          $path = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (-not ($path -split ';' -contains $dir)) { throw "PATH is missing $dir : $path" }
          if ((Get-Item HKCU:\Environment).GetValueKind('Path') -ne 'ExpandString') { throw "PATH lost REG_EXPAND_SZ" }
          & "$dir\jagprox.exe" install-cli

          Start-Process -Wait "$dir\uninstall.exe" -ArgumentList '/S',"_?=$dir"
          $path = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if ($path -split ';' -contains $dir) { throw "uninstall left $dir on PATH" }
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: dist/*

  app-macos:
    needs: version
    runs-on: macos-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        run: cargo install --locked "$PACKAGER"
      - name: Build universal binaries
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p jagprox-gui -p jagprox-cli --target $t
          done
          # cargo-packager packages whatever binary we hand it; make them universal.
          mkdir -p crates/jagprox-gui/binaries
          lipo -create -output target/release/jagprox-launcher \
            target/aarch64-apple-darwin/release/jagprox-launcher \
            target/x86_64-apple-darwin/release/jagprox-launcher
          lipo -create -output crates/jagprox-gui/binaries/jagprox-aarch64-apple-darwin \
            target/aarch64-apple-darwin/release/jagprox \
            target/x86_64-apple-darwin/release/jagprox
      - name: Build the .app and .dmg
        run: cargo packager -p jagprox-gui --formats app dmg --out-dir dist-pkg
      - name: Collect
        run: |
          mkdir -p dist
          cp dist-pkg/*.dmg "dist/JagProx-${V}-universal.dmg"
          tar -czf "dist/JagProx-${V}-universal.app.tar.gz" -C dist-pkg JagProx.app
          dist-pkg/JagProx.app/Contents/MacOS/jagprox --version | grep -F "$V"
          lipo -archs dist-pkg/JagProx.app/Contents/MacOS/jagprox-launcher
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: dist/*

  publish:
    needs: [version, cli-linux, app-linux, app-windows, app-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release metadata
        run: python3 scripts/release-manifest.py "$V" dist
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/jagprox-release.json -t "JagProx $V"
          rm -f "$RUNNER_TEMP/minisign.key"
          # The key the apps trust (crates/jagprox-core/src/update.rs) must verify it.
          key=$(sed -n 's/^const PUBLIC_KEY: &str = "\(.*\)";$/\1/p' crates/jagprox-core/src/update.rs)
          minisign -V -m dist/jagprox-release.json -P "$key"
      - name: AUR PKGBUILD
        run: |
          mkdir -p aur
          sed -e "s/@VERSION@/$V/g" -e "s/@PKGVER@/${V//-/_}/g" \
              -e "s/@SHA_X86_64@/$(sha256sum "dist/jagprox_${V}_amd64.deb" | cut -d' ' -f1)/" \
              -e "s/@SHA_AARCH64@/$(sha256sum "dist/jagprox_${V}_arm64.deb" | cut -d' ' -f1)/" \
              packaging/aur/PKGBUILD.in > aur/PKGBUILD
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/@VERSION@/$V/g" packaging/release-notes.md > notes.md
          pre=""; case "$V" in *-*) pre="--prerelease";; esac
          gh release create "v$V" dist/* aur/PKGBUILD packaging/install.sh --draft $pre --title "JagProx $V" --notes-file notes.md
