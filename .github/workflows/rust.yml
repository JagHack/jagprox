name: Rust

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # node-minecraft-protocol is the reference the codec is tested against.
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install node packages (without Electron's binary download)
        run: npm ci --ignore-scripts

      # The launcher window (Tauri) needs WebKitGTK on Linux.
      - name: Install launcher build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev pkg-config

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # The `jagprox` command must be one static binary that runs on every Linux distro.
  linux-static:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build static jagprox
        run: cargo build --release --target x86_64-unknown-linux-musl -p jagprox-cli

      - name: Check it is static
        run: |
          file target/x86_64-unknown-linux-musl/release/jagprox
          file target/x86_64-unknown-linux-musl/release/jagprox | grep -q 'static'

      - name: Run on other distros
        run: |
          for image in debian:stable ubuntu:latest fedora:latest opensuse/tumbleweed \
                       archlinux:latest alpine:latest ghcr.io/void-linux/void-musl nixos/nix; do
            echo "== $image"
            docker run --rm -v "$PWD/target/x86_64-unknown-linux-musl/release/jagprox:/jagprox:ro" \
              "$image" /jagprox --version
          done

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: jagprox-linux-x86_64-static
          path: target/x86_64-unknown-linux-musl/release/jagprox

  nix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build Nix package
        run: nix-build nix -A jagprox-cli && ./result/bin/jagprox --version
