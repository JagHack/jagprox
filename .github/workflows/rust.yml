name: Rust

on:
  push:
    branches: [main, native-ui]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # node-minecraft-protocol is the reference the codec is tested against.
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install node packages (without Electron's binary download)
        run: npm ci --ignore-scripts

      # The native launcher (egui/glow) needs OpenGL, Wayland and X11 dev libraries on Linux.
      - name: Install launcher build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libxcursor-dev libxrandr-dev libxi-dev libx11-dev \
            libfontconfig1-dev libfreetype-dev libssl-dev libdbus-1-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # The `jagprox` command must be one static binary that runs on every Linux distro.
  linux-static:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build static jagprox
        run: cargo build --release --target x86_64-unknown-linux-musl -p jagprox-cli

      - name: Check it is static
        run: |
          file target/x86_64-unknown-linux-musl/release/jagprox
          file target/x86_64-unknown-linux-musl/release/jagprox | grep -q 'static'

      - name: Run on other distros
        run: |
          for image in debian:stable ubuntu:latest fedora:latest opensuse/tumbleweed \
                       archlinux:latest alpine:latest ghcr.io/void-linux/void-musl nixos/nix; do
            echo "== $image"
            docker run --rm -v "$PWD/target/x86_64-unknown-linux-musl/release/jagprox:/jagprox:ro" \
              "$image" /jagprox --version
          done

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jagprox-linux-x86_64-static
          path: target/x86_64-unknown-linux-musl/release/jagprox

  nix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build Nix packages
        run: |
          nix-build nix -A jagprox-cli -o result-cli && ./result-cli/bin/jagprox --version
          nix-build nix -A jagprox -o result-app && ./result-app/bin/jagprox --version
          test -x result-app/bin/jagprox-launcher

  install-script:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Shellcheck install.sh
        run: shellcheck packaging/install.sh
