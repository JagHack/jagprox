[workspace]
resolver = "3"
members = ["crates/mcproto", "crates/jagprox-core", "crates/jagprox-cli", "crates/jagprox-gui", "crates/compass"]

[workspace.package]
version = "3.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["JagHack"]
repository = "https://github.com/JagHack/jagprox"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind" # a bug in one module must not take down the session

[profile.release.package.jagprox-cli]
opt-level = "s"

[profile.release.package.jagprox-gui]
opt-level = "s"
