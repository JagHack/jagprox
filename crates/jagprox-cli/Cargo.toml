[package]
name = "jagprox-cli"
description = "jagprox command: CLI and headless proxy (no GUI dependencies, builds fully static)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "jagprox"
path = "src/main.rs"

[dependencies]
jagprox-core = { path = "../jagprox-core" }
clap = { version = "4", features = ["derive"] }
dirs = "6"
getrandom = "0.3"
keyring = "4"
open = "5"
reqwest = { version = "0.13", default-features = false }
rpassword = "7"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal"] }

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
