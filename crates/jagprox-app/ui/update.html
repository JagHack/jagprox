<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';">
    <title>Update Available</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            -webkit-app-region: drag;
            user-select: none;
        }

        h2 {
            margin-top: 0;
            font-size: 18px;
            color: #ffffff;
        }

        p {
            font-size: 14px;
            color: #a6adc8;
            line-height: 1.5;
        }

        .actions {
            margin-top: 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            -webkit-app-region: no-drag;
        }

        button {
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-update {
            background-color: #cba6f7;
            color: #11111b;
        }

        .btn-update:hover {
            background-color: #b4befe;
        }

        .btn-skip {
            background-color: #313244;
            color: #cdd6f4;
        }

        .btn-skip:hover {
            background-color: #45475a;
        }

        .version-badge {
            background: #45475a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            color: #cba6f7;
        }
    </style>
</head>
<body data-tauri-drag-region>
    <h2 data-tauri-drag-region>Update Available</h2>
    <p data-tauri-drag-region>A new version of JagProx is available: <span id="version" class="version-badge">v0.0.0</span>. Would you like to update now?</p>

    <div class="actions">
        <button class="btn-skip" id="skip">Skip for now</button>
        <button class="btn-update" id="update">Update Now</button>
    </div>

    <script src="./bridge.js"></script>
    <script src="./update.js"></script>
</body>
</html>
