[package]
name = "jagprox-core"
description = "JagProx proxy session, modules and commands"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
mcproto = { path = "../mcproto" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
futures = "0.3"
getrandom = "0.3"
indexmap = "2"
keyring = "4"
minisign-verify = "0.2"
png = "0.18"
# rustls with `ring` instead of the default aws-lc-rs: no cmake, builds fully static.
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
snap = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "net"] }
webpki-roots = "1"


# Unpacking updates (.tar.gz) only happens on Linux and macOS.
[target.'cfg(unix)'.dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = { version = "0.4", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "net"] }
jagprox-compass = { path = "../compass" }
