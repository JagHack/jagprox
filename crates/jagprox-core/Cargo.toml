[package]
name = "jagprox-core"
description = "JagProx proxy session, modules and commands"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mcproto = { path = "../mcproto" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
indexmap = "2"
png = "0.18"
# rustls with `ring` instead of the default aws-lc-rs: no cmake, builds fully static.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
webpki-roots = "1"

